---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: manual-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/data/pv-demo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: manual-pvc
spec:
  volumeName: manual-pv
  storageClassName: ""
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-pvc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange-pvc
  template:
    metadata:
      labels:
        app: data-exchange-pvc
    spec:
      containers:
        - name: writer
          image: busybox
          command: ["/bin/sh", "-c"]
          args:
            - >
              while true; do
                echo "$(date) - write from busybox" >> /data/shared.log;
                sleep 5;
              done
          volumeMounts:
            - name: pvc-storage
              mountPath: /data

        - name: reader
          image: busybox
          command: ["/bin/sh", "-c"]
          args: ["tail -f /data/shared.log"]
          volumeMounts:
            - name: pvc-storage
              mountPath: /data

      volumes:
        - name: pvc-storage
          persistentVolumeClaim:
            claimName: manual-pvc