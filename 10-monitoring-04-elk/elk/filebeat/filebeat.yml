filebeat.inputs:
  - type: container
    paths:
      - /var/lib/docker/containers/*/*.log

processors:
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"
  - decode_json_fields:
      fields: ["message"]
      target: "docker_log"
      overwrite_keys: true
      max_depth: 2

output.logstash:
  hosts: ["logstash:5000"]

logging.level: info
