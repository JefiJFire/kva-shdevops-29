frontend:
  replicaCount: 1
  image:
    repository: nginx
    tag: "1.25"
    pullPolicy: IfNotPresent
  service:
    port: 80

backend:
  replicaCount: 1
  image:
    repository: nginx
    tag: "1.25"
    pullPolicy: IfNotPresent
  service:
    port: 8080
  persistence:
    size: 1Gi

# Общая метка версии релиза, чтобы было видно на скриншотах, какая версия развёрнута
appVersion: "v1"